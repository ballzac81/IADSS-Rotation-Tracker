# Unraid / home server — Hyperliquid spot rotator only.
# Joins your existing Cloudflare tunnel network for HTTPS.
# Does not start Freqtrade and does not talk to IADSS.
#
# /boot/config/go:
#   cd /mnt/user/appdata/IADSS-Rotation-Tracker && docker compose -f docker-compose.selfhosted.yml up -d
#
# Cloudflare:
#   rotate.yourdomain.com  →  http://rotation-tracker:5000

services:
  rotation-tracker:
    build: .
    container_name: rotation-tracker
    restart: unless-stopped
    networks:
      - tunnel_network
    ports:
      - "5002:5000"
    env_file:
      - .env
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  tunnel_network:
    name: ${DOCKER_NETWORK}
    external: true
