# IADSS Rotation Tracker — own Freqtrade on a dedicated Kraken subaccount.
# Do NOT point this at the live IADSS API keys. IADSS keeps SOL / HYPE / TAO
# independent on the main account; this stack is the separate HYPE/SOL sleeve.

services:
  rotation-freqtrade:
    image: freqtradeorg/freqtrade:stable
    container_name: rotation-freqtrade
    restart: unless-stopped
    ports:
      - "8068:8080"
    volumes:
      - ./user_data:/freqtrade/user_data
    command: >
      trade
      --logfile /freqtrade/user_data/logs/freqtrade.log
      --db-url sqlite:////freqtrade/user_data/tradesv3.sqlite
      --config /freqtrade/user_data/config.json
      --strategy WebhookStrategy

  rotation-tracker:
    build: .
    container_name: rotation-tracker
    restart: unless-stopped
    ports:
      - "5002:5000"
    env_file:
      - .env
    environment:
      - FREQTRADE_API=http://rotation-freqtrade:8080/api/v1
      - FREQTRADE_USER=admin
      - FREQTRADE_PASS=${FREQTRADE_PASS}
    volumes:
      - ./data:/data
    depends_on:
      rotation-freqtrade:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
