# Hyperliquid spot rotator. No Freqtrade. Does not touch Kraken / IADSS / PTOS.

services:
  rotation-tracker:
    build: .
    container_name: rotation-tracker
    restart: unless-stopped
    ports:
      - "5002:5000"
    env_file:
      - .env
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
